name: Particle Phase 2 validation

on:
  push:
    branches: [ "work/h24-particle-phase2" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: GPU particle protocol, shader and D3D11 WARP conformance
        shell: pwsh
        run: dotnet run --project Tests/Genesis.Particle.Checks/Genesis.Particle.Checks.csproj --configuration Release -- --warp-conformance
      - name: Build Studio with warnings as errors
        shell: pwsh
        run: dotnet build Source/Genesis.Application.Studio/Genesis.Application.Studio.csproj --configuration Release -warnaserror
