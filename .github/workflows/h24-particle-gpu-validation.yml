name: H24 particle GPU validation
on:
  push:
    branches: ['work/h24-gpu-validation']
permissions:
  contents: read
concurrency:
  group: h24-particle-gpu-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build Studio and runtime
        shell: pwsh
        run: dotnet build Source/Genesis.Application.Studio/Genesis.Application.Studio.csproj --configuration Release -warnaserror
      - name: Compile particle shaders and run D3D11 WARP compute semantics
        shell: pwsh
        run: dotnet run --project Tests/Genesis.Particle.Checks --configuration Release -- --warp-conformance
      - name: Run production core regressions
        shell: pwsh
        run: dotnet run --project Tests/Genesis.Foundation.Checks --configuration Release
